<!doctype html><html><head><meta charset="utf-8"><title>Isolated animation renderer</title></head><body><script>
'use strict';
let channel='',worker=null,workerURL='',pending=new Map();
function send(value,transfer=[]){parent.postMessage({channel,...value},'*',transfer);}
function stop(){if(worker)worker.terminate();worker=null;if(workerURL)URL.revokeObjectURL(workerURL);workerURL='';for(const [id,timer]of pending){clearTimeout(timer);send({id,fatal:true,error:'动画运行超时，已停止此镜。请重新生成更简洁的代码。'});}pending.clear();}
addEventListener('message',event=>{
  if(event.source!==parent)return;const m=event.data||{};
  if(m.type==='init'&&!channel){
    channel=m.channel;workerURL=URL.createObjectURL(new Blob([m.workerSource],{type:'text/javascript'}));worker=new Worker(workerURL);
    worker.onmessage=event=>{const r=event.data;if(!pending.has(r.id)){r.bitmap?.close();return;}clearTimeout(pending.get(r.id));pending.delete(r.id);send(r,r.bitmap?[r.bitmap]:[]);};
    worker.onerror=()=>stop();
  }
  if(m.channel!==channel||!worker)return;
  if(m.type==='stop'){stop();return;}
  const timer=setTimeout(stop,m.type==='init'?20000:6000);pending.set(m.id,timer);
  const payload={...m};delete payload.workerSource;worker.postMessage(payload);
});
</script></body></html>
